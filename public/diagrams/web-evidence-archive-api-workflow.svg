<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="web-archive-title web-archive-desc">
    <title id="web-archive-title">Verifiable web evidence archive</title>
    <desc id="web-archive-desc">A source URL branches into site context and page capture. Screenshot, HTML, PDF, and Word artifacts converge into a SHA-256 manifest before entering immutable archive storage.</desc>
    <defs>
      <pattern id="archive-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#142454" opacity="0.08"/></pattern>
      <marker id="archive-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#677788"/></marker>
      <marker id="archive-arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#377dff"/></marker>
      <style>
        .eyebrow { fill: #677788; font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2.8px; }
        .heading { fill: #1e2022; font: 400 42px "Instrument Serif", Georgia, serif; }
        .subheading { fill: #677788; font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .lane { fill: #8c98a4; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.5px; text-anchor: middle; }
        .node-title { fill: #1e2022; font: 650 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
        .node-copy { fill: #677788; font: 400 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
        .node-copy-accent { fill: #142454; font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
        .legend { fill: #677788; font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      </style>
    </defs>
    <rect width="1280" height="720" fill="#f7faff"/>
    <rect width="1280" height="720" fill="url(#archive-dots)"/>
    <text x="56" y="64" class="eyebrow">DATA FLOW · EVIDENCE BOUNDARY</text>
    <text x="56" y="116" class="heading">Capture artifacts first, then hash and archive them</text>
    <text x="56" y="150" class="subheading">A manifest verifies stored bytes and acquisition context; it does not replace the screenshot, HTML, or document files.</text>

    <rect x="56" y="212" width="1168" height="344" rx="16" fill="#f8fafd" stroke="#e7eaf3" stroke-width="2"/>
    <line x1="56" y1="252" x2="1224" y2="252" stroke="#e7eaf3" stroke-width="2"/>
    <text x="136" y="238" class="lane">SOURCE</text>
    <text x="396" y="238" class="lane">ACQUIRE</text>
    <text x="656" y="238" class="lane">DERIVE</text>
    <text x="904" y="238" class="lane">VERIFY</text>
    <text x="1136" y="238" class="lane">ARCHIVE</text>

    <!-- Source branching and artifact convergence use only orthogonal paths. -->
    <path class="connector" d="M216 380 H256 V332 H296" fill="none" stroke="#677788" stroke-width="3" marker-end="url(#archive-arrow)"/>
    <path class="connector" d="M216 380 H256 V476 H296" fill="none" stroke="#677788" stroke-width="3" marker-end="url(#archive-arrow)"/>
    <path class="connector" d="M456 476 H576" fill="none" stroke="#677788" stroke-width="3" marker-end="url(#archive-arrow)"/>
    <path class="connector" d="M456 332 H756 V360 H816" fill="none" stroke="#677788" stroke-width="3" marker-end="url(#archive-arrow)"/>
    <path class="connector" d="M736 476 H776 V420 H816" fill="none" stroke="#677788" stroke-width="3" marker-end="url(#archive-arrow)"/>
    <path class="connector" d="M992 390 H1056" fill="none" stroke="#377dff" stroke-width="4" marker-end="url(#archive-arrow-accent)"/>

    <rect class="node" x="56" y="320" width="160" height="120" rx="12" fill="#f7faff" stroke="#cfd6e4" stroke-width="2"/>
    <text x="136" y="364" class="node-title">Source URL</text>
    <text x="136" y="392" class="node-copy">requested + final URL</text>
    <text x="136" y="416" class="node-copy">capture timestamp</text>

    <rect class="node" x="296" y="272" width="160" height="120" rx="12" fill="#f7faff" stroke="#cfd6e4" stroke-width="2"/>
    <text x="376" y="312" class="node-title">Site Context</text>
    <text x="376" y="340" class="node-copy">favicon · DNS · SSL</text>
    <text x="376" y="364" class="node-copy">WHOIS observation</text>

    <rect class="node" x="296" y="416" width="160" height="120" rx="12" fill="#f7faff" stroke="#cfd6e4" stroke-width="2"/>
    <text x="376" y="456" class="node-title">Page Capture</text>
    <text x="376" y="484" class="node-copy">full-page screenshot</text>
    <text x="376" y="508" class="node-copy">static HTML</text>

    <rect class="node" x="576" y="416" width="160" height="120" rx="12" fill="#f7faff" stroke="#cfd6e4" stroke-width="2"/>
    <text x="656" y="456" class="node-title">Derivatives</text>
    <text x="656" y="484" class="node-copy">PDF · Word</text>
    <text x="656" y="508" class="node-copy">review + handoff</text>

    <rect class="node" x="816" y="310" width="176" height="160" rx="12" fill="#eef4ff" stroke="#377dff" stroke-width="3"/>
    <text x="904" y="348" class="node-title">Hash Manifest</text>
    <text x="904" y="378" class="node-copy-accent">SHA-256 · byte length</text>
    <text x="904" y="404" class="node-copy-accent">capture options</text>
    <text x="904" y="430" class="node-copy-accent">step status</text>

    <rect class="node" x="1056" y="330" width="160" height="120" rx="12" fill="#f7faff" stroke="#142454" stroke-width="2"/>
    <text x="1136" y="372" class="node-title">Archive Version</text>
    <text x="1136" y="400" class="node-copy">append-only</text>
    <text x="1136" y="424" class="node-copy">verify on retrieval</text>

    <line x1="56" y1="632" x2="1224" y2="632" stroke="#e7eaf3" stroke-width="2"/>
    <line x1="64" y1="670" x2="112" y2="670" stroke="#677788" stroke-width="3" marker-end="url(#archive-arrow)"/>
    <text x="128" y="675" class="legend">Artifact or context handoff</text>
    <line x1="368" y1="670" x2="416" y2="670" stroke="#377dff" stroke-width="4" marker-end="url(#archive-arrow-accent)"/>
    <text x="432" y="675" class="legend">Verified archive boundary</text>
    <text x="1224" y="675" class="legend" text-anchor="end">GuGuData.io · 2026-08-20</text>
  </svg>
